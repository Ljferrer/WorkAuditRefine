# INERT T4 TEMPLATE: activation in .github/workflows requires a separate review.
name: WAR baseline
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [master, codex-port]
permissions:
  contents: read
jobs:
  baseline:
    name: Baseline (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Isolated test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          git --version
          jq --version
          /bin/bash --version
          python -m venv "$RUNNER_TEMP/war-ci-python"
          "$RUNNER_TEMP/war-ci-python/bin/python" -m pip install PyYAML==6.0.2
          echo "$RUNNER_TEMP/war-ci-python/bin" >> "$GITHUB_PATH"
      - name: Complete tracked baseline and package contracts
        shell: bash
        run: node scripts/ci/collect.mjs --run "$RUNNER_TEMP/war-baseline"
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-${{ matrix.platform }}
          path: ${{ runner.temp }}/war-baseline/
          if-no-files-found: error
          retention-days: 7
  gate:
    name: WAR CI
    if: always()
    needs: [baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: baseline-*
          path: ${{ runner.temp }}/war-reports
      - name: Reject incomplete or mismatched evidence
        env:
          WAR_CI_NEEDS: ${{ toJSON(needs) }}
          WAR_CI_SHA: ${{ github.sha }}
        run: node scripts/ci/check-war-ci.mjs "$WAR_CI_SHA" "$RUNNER_TEMP/war-reports"
