# Gate 3 of the memory substrate (spec §4.6): the POST-PUSH BACKSTOP on a
# hand-committed lesson that never went through the war-memory CLI — it catches
# whatever reaches a PR without passing a WAR gate. PRE-MERGE enforcement of this
# same lint is the gate-discovered suite skills/_shared/war-memory-lint.test.sh
# (#1081): the gate's own `-name '*.test.sh'` sweep runs it, so lint results land
# in the captured `.war/gate-<taskId>.log` artifact. This WORKFLOW is
# WAR-repo-only — it is not plugin code. Directory-wide lint is simpler than
# diff-scoped and strictly stronger. Enforced-by-CI, deliberately not
# unit-validated (plan Task 7).
name: memory-audit

on:
  pull_request:
    paths:
      - 'docs/learnings/**'
      - 'skills/_shared/war-memory.mjs'
      - '.github/workflows/memory-audit.yml'

# Read-only linter: never writes, comments, or pushes. Least-privilege.
permissions:
  contents: read

jobs:
  redaction-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # node:sqlite / FTS5 floor
      # Fails the job on any lint hit (CLI exits non-zero — fail-closed).
      # Absent docs/learnings/ → "lint: clean", exit 0 (fail-open on absence);
      # the pre-merge wrapper instead fails LOUD on an absent target, so a moved
      # or renamed dir can never make the gate evidence silently vacuous.
      - run: node skills/_shared/war-memory.mjs lint docs/learnings/
