; The microsoftFork profile: the house WorkAuditRefine rules PLUS a tuned cut of the
; Microsoft Writing Style Guide, vendored under styles/Microsoft from
; errata-ai/Microsoft v0.15.1 (MIT — see styles/Microsoft/LICENSE; vendored 2026-08-29
; via `vale sync`, unmodified). Selected by hooks.valeStyle: "microsoftFork".
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = WorkAuditRefine, Microsoft

; House rule kept off here too (em/en dashes are entrenched repo style).
WorkAuditRefine.Dashes = NO
; Twins of house rules — keep the house rule, drop the duplicate.
Microsoft.Foreign = NO
Microsoft.SentenceLength = NO

; Tuning, mirroring the workAuditRefine fork rationale: rules that judge this repo's entrenched
; voice or fight the Reply Standard card, not defects.
; Microsoft RECOMMENDS contractions; the card's meter counts them as violations — card wins.
Microsoft.Contractions = NO
Microsoft.Acronyms = NO
Microsoft.HeadingAcronyms = NO
Microsoft.Headings = NO
Microsoft.HeadingColons = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Dashes = NO
Microsoft.Semicolon = NO
Microsoft.Quotes = NO
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.OxfordComma = NO
; Vocab is a substitution-style suggestion set (the Google.WordList analog).
Microsoft.Vocab = NO
