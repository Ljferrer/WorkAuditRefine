; The DEFAULT vale-md profile: the house ReplyStandard rules PLUS a tuned cut of the
; Google developer-documentation style, vendored (not synced) under styles/Google from
; errata-ai/Google v0.7.1 (MIT — see styles/Google/LICENSE; vendored 2026-08-29 via
; `vale sync`, unmodified) so lint time needs no network and rule updates are
; deliberate commits, never a floating package.
; vale-md.py selects this profile unless .claude/war/config.json sets
; hooks.valeGoogleFork: false, which swaps to the house-only .vale.ini.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = ReplyStandard, Google

; House rule kept off here too (em/en dashes are entrenched repo style).
ReplyStandard.Dashes = NO
; Google.Latin duplicates ReplyStandard.LatinAbbrev — keep the house rule, drop the twin.
Google.Latin = NO

; Tuning, from the 2026-08-29 prototype sweep (1810 raw vs 377 tuned findings over five
; repo docs): the rules below judged this repo's entrenched voice, not defects.
Google.Parens = NO
Google.EmDash = NO
Google.Semicolons = NO
Google.Acronyms = NO
Google.Contractions = NO
Google.LyHyphens = NO
Google.Colons = NO
Google.Quotes = NO
Google.FirstPerson = NO
Google.WordListCase = NO
Google.OxfordComma = NO
Google.Will = NO
Google.Headings = NO
; The Reply Standard card mandates BRITISH spelling; Google.Spelling enforces American.
; The card wins in this plugin.
Google.Spelling = NO
; WordList is a replace-action substitution list ("CLI" -> "command-line tool", "url" ->
; "URL", ...) that fires on repo-ratified vocabulary; audit-flagged, off by default.
Google.WordList = NO
