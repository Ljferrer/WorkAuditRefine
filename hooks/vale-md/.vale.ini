; House-only Vale profile for the vale-md hook, selected when .claude/war/config.json
; sets hooks.valeGoogleFork: false; the default profile is the sibling .vale-google.ini,
; which layers the vendored styles/Google on top of these rules. No Packages line in
; either file on purpose: synced packages need network at lint time, and a plugin hook
; must work offline.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = ReplyStandard
; Off by default: em/en dashes are entrenched house style across this repo's docs
; (281 hits over five files in the 2026-08-29 prototype run). Flip to YES to hunt them.
ReplyStandard.Dashes = NO
