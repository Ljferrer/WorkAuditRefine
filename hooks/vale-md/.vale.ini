; Self-contained Vale profile for the vale-md hook. No Packages line on purpose:
; remote packages (Google, write-good) need `vale sync` + network at lint time, and a
; plugin hook must work offline. Layer richer packages via a project-level .vale.ini.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = ReplyStandard
; Off by default: em/en dashes are entrenched house style across this repo's docs
; (281 hits over five files in the 2026-08-29 prototype run). Flip to YES to hunt them.
ReplyStandard.Dashes = NO
